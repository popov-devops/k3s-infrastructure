
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-music
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  mountOptions:
    - nfsvers=3
    - ro
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.88.160
    path: /export/NAS4
    readOnly: true
